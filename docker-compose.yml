services:
  server: 
    build: .
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - db

  db:
    image: postgres:18.6
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST} 
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
